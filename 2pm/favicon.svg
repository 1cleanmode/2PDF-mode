<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="iconGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#0891b2"/>
    </linearGradient>
  </defs>

  <!-- rounded square badge -->
  <rect x="4" y="4" width="56" height="56" rx="14" ry="14" fill="url(#iconGrad)"/>

  <!-- subtle inner highlight on the top edge -->
  <rect x="4" y="4" width="56" height="56" rx="14" ry="14"
        fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="1.5"/>

  <!-- bold "2" -->
  <text x="32" y="45"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="42"
        font-weight="900"
        fill="#ffffff"
        letter-spacing="-1">2</text>
</svg>